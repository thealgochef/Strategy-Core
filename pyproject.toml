[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy-core"
version = "0.1.0"
description = "Shared, versioned strategy engine for zero-drift parity between Claude-Quant-Lab (research) and Trade-Lab (runtime)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "algochef" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyarrow>=18.0",  # Databento parquet source runtime/tests
    "tzdata>=2025.2",
]

[project.optional-dependencies]
databento = ["databento>=0.79"]

dev = [
    "pytest>=8",
    "pandas>=2.0",   # only the candle BATCH builder and its tests touch pandas
    # Ceiling, not preference: ruff 0.16.0 expanded the DEFAULT rule set (this repo sets
    # no [tool.ruff.lint] select, so it rides the defaults) and the cold-install CI went
    # red on an unchanged tree — 113 findings, identical on the prior green tip. Findings
    # deferred to a scoped lint window; lift the ceiling there, not here.
    "ruff>=0.15,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_core"]

[tool.pytest.ini_options]
# W2 P4a: validation/ rides the suite; its data-dependent tests self-skip
# loudly when the local store / research repo are absent (CI cold runners).
testpaths = ["tests", "validation"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
